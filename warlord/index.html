<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>A Warlord awaits you in Legaryn</title>
  <meta name="description" content="A Warlord wants you at their side in Legaryn: Mythic Legends. Open the game to find their profile." />
  <meta name="theme-color" content="#08090A" />
  <meta property="og:title" content="A Warlord awaits you in Legaryn" />
  <meta property="og:description" content="Add me on Legaryn: Mythic Legends." />
  <meta property="og:image" content="https://legaryn.com/art/hero-pale-widow.jpg" />
  <link rel="icon" href="/art/favicon.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --abyss: #08090A; --iron: #121214; --gold: #C9A45C; --gold-bright: #F0D995; --gold-rule: rgba(201,164,92,0.28);
      --ember: #E0703A; --bone: #EDE4D0; --parchment: #CDBF9F; --dim: #8E8473;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--abyss); color: var(--parchment); font-family: 'Manrope', system-ui, sans-serif; line-height: 1.6; -webkit-font-smoothing: antialiased; min-height: 100vh; }
    .hero { position: relative; min-height: 100vh; display: flex; align-items: flex-end; justify-content: center; background: url('/art/war-onslaught.jpg') center 30% / cover no-repeat; }
    .hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,9,10,0.3) 0%, rgba(8,9,10,0.6) 40%, rgba(8,9,10,0.97) 75%, var(--abyss) 100%); }
    .card { position: relative; width: 100%; max-width: 460px; padding: 32px 22px calc(36px + env(safe-area-inset-bottom)); text-align: center; }
    .wordmark { width: 220px; max-width: 70%; margin: 0 auto 18px; display: block; filter: drop-shadow(0 4px 20px rgba(0,0,0,0.8)); }
    .kicker { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 3px; color: var(--ember); }
    h1 { font-family: 'Cinzel', serif; font-weight: 900; color: var(--gold-bright); font-size: clamp(26px, 7vw, 36px); margin-top: 8px; text-shadow: 0 2px 14px rgba(0,0,0,0.8); }
    .lede { color: var(--bone); margin-top: 10px; font-size: 15px; }
    .btn { display: block; margin: 26px auto 0; max-width: 320px; padding: 16px 22px; border-radius: 14px; text-decoration: none; background: linear-gradient(180deg, var(--gold-bright), var(--gold)); color: #1A1408; font-family: 'Cinzel', serif; font-weight: 900; letter-spacing: 2.5px; font-size: 16px; box-shadow: 0 6px 30px rgba(201,164,92,0.25); }
    .stores { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
    .store { flex: 1 1 140px; max-width: 155px; padding: 12px 10px; border-radius: 12px; text-decoration: none; border: 1px solid var(--gold-rule); background: rgba(18,18,20,0.9); color: var(--bone); font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 1px; }
    .store small { display: block; font-family: 'Manrope', sans-serif; font-size: 10.5px; color: var(--dim); letter-spacing: 0; margin-bottom: 2px; }
    footer { margin-top: 28px; font-size: 12px; color: var(--dim); letter-spacing: 1px; }
    footer a { color: var(--gold); text-decoration: none; margin: 0 8px; }
  </style>
</head>
<body>
  <section class="hero">
    <div class="card">
      <img class="wordmark" src="/art/wordmark.webp" alt="Legaryn: Mythic Legends" />
      <div class="kicker">A WARLORD AWAITS</div>
      <h1>Stand at their side</h1>
      <p class="lede">Open Legaryn to see their profile, add them as an ally or call them to your crew.</p>
      <a class="btn" id="open" href="rork-5kpdvymua3a3bvwtuhcwm://find-player">OPEN LEGARYN</a>
      <div class="stores">
        <a class="store" href="https://apps.apple.com/app/id6821201727" rel="noopener"><small>Download on the</small>App Store</a>
        <a class="store" href="https://play.google.com/store/apps/details?id=app.rork.5kpdvymua3a3bvwtuhcwm" rel="noopener"><small>Get it on</small>Google Play</a>
      </div>
      <footer>
        <a href="/">LEGARYN</a><a href="/support/">SUPPORT</a><a href="/privacy/">PRIVACY</a>
      </footer>
    </div>
  </section>
  <script>
    (function () {
      var id = new URLSearchParams(window.location.search).get('id') || '';
      if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)) {
        document.getElementById('open').href = 'rork-5kpdvymua3a3bvwtuhcwm://find-player?id=' + id;
      }
    })();
  </script>
</body>
</html>
