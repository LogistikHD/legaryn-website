    /* PARTICLES */
    .particles { position: absolute; top:0; left:0; right:0; bottom:0; pointer-events:none; overflow:hidden; }
    .particle { position:absolute; width:2px; height:2px; background:#00E5CC; border-radius:50%; opacity:0; animation: rise linear infinite; }
    @keyframes rise {
      0%   { opacity:0; transform:translateY(100vh); }
      10%  { opacity:0.3; }
      90%  { opacity:0.3; }
      100% { opacity:0; transform:translateY(-10px); }
    }

    /* HERO */
    .hero {
      min-height: 100vh;
      background: linear-gradient(180deg, #0a0a0f 0%, #0d1a1a 50%, #0a0a0f 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 2rem 3rem;
      position: relative;
    }

  /* RUNE RING + SKULL LOGO GLOW (UPDATED) */
.rune-ring {
  width: 130px;
  height: 130px;
  border: 2px solid #00E5CC;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 1.5rem;
  position: relative;
  overflow: hidden; /* Ensures the graphic stays crisp inside the ring circular path */
  animation: pulse-ring 2.5s ease-in-out infinite;
  box-shadow: 
    0 0 20px #00E5CC,
    0 0 40px #00E5CC,
    inset 0 0 30px #00E5CC33;
}

@keyframes pulse-ring {
  0%, 100% { box-shadow: 0 0 20px #00E5CC, 0 0 40px #00E5CC, inset 0 0 30px #00E5CC33; }
  50%      { box-shadow: 0 0 45px #00E5CC, 0 0 70px #a855f7, inset 0 0 50px #a855f766; }
}

.main-logo {
  width: 130px; /* Scales fully to lock into the exact size of the ring */
  height: 130px;
  object-fit: cover;
  display: block;
  animation: skull-glow 2s ease-in-out infinite alternate;
}

@keyframes skull-glow {
  from { filter: drop-shadow(0 0 8px #00E5CC) drop-shadow(0 0 20px #a855f7); }
  to   { filter: drop-shadow(0 0 18px #00E5CC) drop-shadow(0 0 35px #a855f7); }
}
